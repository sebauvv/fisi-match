services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: soft-int-pgvector
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: advisors_db
      POSTGRES_USER: advisor_user
      POSTGRES_PASSWORD: advisor_local_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advisor_user -d advisors_db"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
